<!--
  PROTOTYPE: throwaway. Answers "Closing information gaps in an Interview Brief" (ecarlste/get-a-job-dude#22).
  Three variants, switchable from the floating bar (or ←/→, or the hash):
    #inline   A: gaps sit inside the brief, in the section they belong to; each closes in place
    #panel    B: briefs on the left, a "What's missing" panel on the right that walks one gap at a time
    #session  C: one sitting: a reading list, then one Gap Check conversation across every gap, then a review
  The bar also cycles candidate names for the Q&A route (Gap Check / Read-back / Fill-in).
  Synthetic data only (Larkspur Robotics is made up). Clock fixed at Fri Oct 30 2026, 10:00 AM.
  State lives in memory; reload resets it.
-->
<style>
:root {
  --bg: #f2f5f6; --surface: #ffffff; --surface-2: #e8eef0; --line: #d2dbdf;
  --fg: #16232a; --muted: #5a6a72;
  --accent: #1d5f86; --accent-soft: #dcebf4; --accent-ink: #ffffff;
  --gap: #a65f00; --gap-bg: #fff0d2;
  --done: #2c7a4c; --done-bg: #e1f1e6;
  --warn: #b42318; --warn-bg: #fde7e4;
  --bar-bg: #16232a; --bar-fg: #f2f5f6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161a; --surface: #152129; --surface-2: #1c2b34; --line: #2a3b45;
    --fg: #e3ebee; --muted: #93a4ac;
    --accent: #6cb2db; --accent-soft: #17344a; --accent-ink: #0b1a22;
    --gap: #f0b04a; --gap-bg: #3a2a0e;
    --done: #6cc493; --done-bg: #143222;
    --warn: #f2877c; --warn-bg: #3d1714;
    --bar-bg: #e3ebee; --bar-fg: #0e161a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161a; --surface: #152129; --surface-2: #1c2b34; --line: #2a3b45;
  --fg: #e3ebee; --muted: #93a4ac;
  --accent: #6cb2db; --accent-soft: #17344a; --accent-ink: #0b1a22;
  --gap: #f0b04a; --gap-bg: #3a2a0e;
  --done: #6cc493; --done-bg: #143222;
  --warn: #f2877c; --warn-bg: #3d1714;
  --bar-bg: #e3ebee; --bar-fg: #0e161a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px; margin: 0;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.app-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; padding-block: 18px 6px; max-width: 1180px; margin: 0 auto; }
.brand { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.proto-tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px dashed var(--muted); color: var(--muted); padding: 1px 6px; border-radius: 4px; }
.clock { margin-left: auto; font-size: 12px; color: var(--muted); }
main.shell { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
.crumb { font-size: 13px; color: var(--muted); }
.crumb b { color: var(--fg); font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip-gap { background: var(--gap-bg); color: var(--gap); }
.chip-done { background: var(--done-bg); color: var(--done); }
.chip-warn { background: var(--warn-bg); color: var(--warn); }
.chip-acc { background: var(--accent-soft); color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-ghost { background: transparent; border-style: dashed; color: var(--muted); }
.btn-link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.stack { display: grid; gap: 8px; }
textarea, input[type=text], select { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 6px 8px; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
select { width: auto; padding: 3px 6px; font-size: 13px; }

/* ---------- briefs ---------- */
.brief { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 14px; }
.brief-head { display: grid; gap: 4px; }
.brief-head h2 { font-size: 22px; }
.grounded { font-size: 12px; color: var(--muted); }
.bsec { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.bsec h3 { font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bsec ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.src { font-size: 12px; color: var(--muted); }
.entry { border-left: 3px solid var(--done); padding: 4px 0 4px 10px; display: grid; gap: 2px; }
.entry.is-stale { border-left-color: var(--warn); }
.entry.is-new { background: var(--done-bg); border-radius: 0 6px 6px 0; }
.entry-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 12px; border-bottom: 2px solid transparent; font-weight: 500; color: var(--muted); }
.tabs button.is-on { color: var(--fg); border-bottom-color: var(--fg); }

/* ---------- gaps ---------- */
.gapblock { border: 1.5px dashed var(--gap); background: color-mix(in srgb, var(--gap-bg) 55%, var(--surface)); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.gapblock.is-quiet { border-style: dotted; opacity: .8; }
.gap-title { font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.gap-why { font-size: 13px; color: var(--muted); }
.links { display: grid; gap: 6px; }
.link { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.link-host { font-size: 12px; color: var(--muted); }
.link-policy { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 12px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.is-on { background: var(--fg); color: var(--bg); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.routebox { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.q { font-weight: 600; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.opt.is-suggested { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.opt.is-suggested::before { content: "★ "; }
.progress { font-size: 12px; color: var(--muted); }
.proposal { border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.dest { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.hint { font-size: 12px; color: var(--gap); }

/* ---------- B: panel ---------- */
.panel-shell { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
.panel { position: sticky; top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; max-height: calc(100vh - 110px); overflow: auto; }
.panel h2 { font-size: 18px; }
.meter { height: 8px; border-radius: 99px; background: var(--gap-bg); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--done); }
.gaplist { display: grid; gap: 6px; }
.gaprow { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.gaprow:hover { border-color: var(--gap); }
.gaprow.is-closed { opacity: .65; }
.mini-gap { font-size: 12px; color: var(--gap); border: 1px dashed var(--gap); border-radius: 6px; padding: 4px 8px; background: none; text-align: left; }
.steps { display: grid; gap: 12px; }
.step { display: grid; gap: 8px; }
.step-n { font-size: 12px; font-weight: 600; color: var(--muted); }
.routecards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.routecard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px; display: grid; gap: 2px; font-size: 13px; }
.routecard b { font-size: 13px; }
.routecard span { font-size: 12px; color: var(--muted); }
.routecard.is-on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.routecard:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- C: session ---------- */
.sess { max-width: 760px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.pill.is-cur { border-color: var(--fg); font-weight: 600; }
.pill.is-done { background: var(--done-bg); color: var(--done); border-color: transparent; }
.pill.is-skip { background: var(--surface-2); color: var(--muted); border-color: transparent; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 12px; }
.chat { display: grid; gap: 10px; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; }
.msg.claude { background: var(--surface); border: 1px solid var(--line); justify-self: start; border-bottom-left-radius: 4px; }
.msg.owner { background: var(--accent); color: var(--accent-ink); justify-self: end; border-bottom-right-radius: 4px; }
.msg.sys { justify-self: center; font-size: 12px; color: var(--muted); background: none; padding: 2px; }
.composer { position: sticky; bottom: 70px; background: var(--bg); padding-block: 8px; display: grid; gap: 8px; }
.review { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 6px; font-size: 13px; z-index: 40; max-width: calc(100% - 32px); }

/* ---------- prototype switcher (not part of the design) ---------- */
.switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; align-items: center; gap: 4px; background: var(--bar-bg); color: var(--bar-fg); padding: 5px; border-radius: 999px; box-shadow: 0 6px 24px rgb(0 0 0 / .28); font-size: 13px; max-width: calc(100% - 24px); }
.switcher button { border: 0; background: transparent; color: inherit; border-radius: 999px; padding: 5px 10px; }
.switcher button:hover { background: color-mix(in srgb, var(--bar-fg) 15%, transparent); }
.sw-label { padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sw-name { border-left: 1px solid color-mix(in srgb, var(--bar-fg) 30%, transparent); padding-left: 4px; margin-left: 2px; white-space: nowrap; }

@media (max-width: 820px) {
  .panel-shell, .review { grid-template-columns: 1fr; }
  .panel { position: static; max-height: none; }
  .routecards { grid-template-columns: 1fr; }
  .msg { max-width: 95%; }
  .sw-label { max-width: 30vw; }
}
</style>

<div id="app"></div>

<script>
// ---------- synthetic data ----------
const NOW_LABEL = 'Fri Oct 30, 10:00 AM';
const TODAY = 'Oct 30';
const NAMES = ['Gap Check', 'Read-back', 'Fill-in'];
const AGES = ['Last 6 months', '6–18 months ago', 'Older than 18 months', 'Not sure'];
const VARIANTS = [
  { key: 'inline', label: 'A · Inline' },
  { key: 'panel', label: 'B · Panel' },
  { key: 'session', label: 'C · Session' },
];
const BRIEF_NAME = { interview: 'Interview Brief', company: 'Company Brief' };

const L = {
  careers: { id: 'careers', label: 'How we hire', host: 'larkspur.example/careers/how-we-hire', capture: true, policy: 'Company page: the app can capture it for you',
    captured: 'Onsite is a half day, four conversations: two coding, one system design, one with the hiring manager. Candidates code in a shared editor; no whiteboards.' },
  glassdoor: { id: 'glassdoor', label: 'Larkspur Robotics interview reviews', host: 'glassdoor.com', capture: false, policy: 'Read it yourself: Glassdoor’s Terms bar automated copying' },
  blind: { id: 'blind', label: '“Larkspur onsite?” thread', host: 'teamblind.com', capture: false, blind: true, policy: 'Read it yourself: Blind bars copying by any means, so close it with your own words or a Q&A' },
  blog: { id: 'blog', label: 'Eng blog: “Streaming 40k robots’ telemetry”', host: 'larkspur.example/blog', capture: true, policy: 'Company page: the app can capture it for you',
    captured: 'Fleet telemetry flows robot → edge gateway → Kafka → a time-series store. The post stresses back-pressure and replaying data after a depot loses its link.' },
  leetcode: { id: 'leetcode', label: 'LeetCode Discuss: Larkspur system design', host: 'leetcode.com', capture: false, policy: 'Read it yourself: LeetCode bars scraping' },
  linkedin: { id: 'linkedin', label: 'Priya Raman on LinkedIn', host: 'linkedin.com', capture: false, policy: 'Read it yourself: LinkedIn bars scraping' },
  team: { id: 'team', label: 'Teams page', host: 'larkspur.example/teams', capture: true, policy: 'Company page: the app can capture it for you',
    captured: 'Fleet Autonomy (lead: Priya Raman) owns routing and fleet telemetry for every depot.' },
  news: { id: 'news', label: 'Newsroom', host: 'larkspur.example/news', capture: true, policy: 'Company page: the app can capture it for you',
    captured: 'Oct 2026: Larkspur merged its Platform and Fleet teams “to move faster on autonomy”. No mention of layoffs.' },
  blind2: { id: 'blind2', label: '“Larkspur reorg?” thread', host: 'teamblind.com', capture: false, blind: true, policy: 'Read it yourself: Blind bars copying by any means, so close it with your own words or a Q&A' },
};

const GAPS = [
  { id: 'g1', brief: 'company', section: 'how', title: 'No information on the onsite format',
    why: 'Your next Interview is part of the onsite, and the brief can’t say how many sessions there are or how coding is done.',
    links: [L.careers, L.glassdoor, L.blind],
    qs: [
      { q: 'How many sessions did the reports describe?', opts: ['4', '5', 'It varied'], suggested: 0 },
      { q: 'How was coding done?', opts: ['Shared editor', 'Whiteboard', 'Take-home review'], suggested: 0 },
      { q: 'Roughly when were those reports posted?', opts: AGES, suggested: 1, age: true },
    ],
    draft: a => `Onsite is ${a[0] === 'It varied' ? 'a varying number of' : a[0]} sessions; coding is done ${a[1] === 'Shared editor' ? 'in a shared editor' : a[1] === 'Whiteboard' ? 'on a whiteboard' : 'as a take-home review'}.` },
  { id: 'g2', brief: 'interview', section: 'questions', title: 'Little on what system design covers for this team',
    why: 'The likely questions are generic robotics prompts, not grounded in reports for this team.',
    links: [L.blog, L.leetcode],
    qs: [
      { q: 'What prompt did people get?', opts: ['Fleet telemetry ingestion', 'Real-time route planning', 'Generic (URL shortener etc.)'], suggested: 0 },
      { q: 'Did interviewers go deep on one part or broad end to end?', opts: ['Deep on one part', 'Broad, end to end'], suggested: 0 },
      { q: 'Roughly when were those posts?', opts: AGES, suggested: 0, age: true },
    ],
    draft: a => `Expect a “${a[0].toLowerCase()}” prompt; reports say interviewers go ${a[1] === 'Deep on one part' ? 'deep on one component' : 'broad, end to end'}.` },
  { id: 'g3', brief: 'interview', section: 'interviewer', title: 'Can’t confirm Priya Raman’s current team',
    why: 'The interviewer research is marked unverified: her title is known, her team isn’t.',
    links: [L.team, L.linkedin],
    qs: [
      { q: 'Which team is she on now?', opts: ['Fleet Autonomy', 'Platform Infra', 'Couldn’t tell'], suggested: 0 },
      { q: 'How long has she been at Larkspur?', opts: ['Under a year', '1–3 years', '3+ years'], suggested: 1 },
    ],
    draft: a => `Priya Raman is on ${a[0] === 'Couldn’t tell' ? 'an unconfirmed team' : a[0]}, at Larkspur ${a[1].toLowerCase()}.` },
  { id: 'g4', brief: 'company', section: 'news', title: 'Nothing on the reorg people mention on Blind',
    why: 'Blind threads hint at a reorg; the brief has no confirmed news about it.',
    links: [L.news, L.blind2],
    qs: [
      { q: 'What did people say happened?', opts: ['Teams were merged', 'Layoffs', 'Nothing confirmed'], suggested: 0 },
      { q: 'Does it seem to touch the team you’re interviewing with?', opts: ['Yes', 'No', 'Unclear'], suggested: 2 },
      { q: 'When were the posts?', opts: AGES, suggested: 0, age: true },
    ],
    draft: a => `Reports say: ${a[0].toLowerCase()}. Effect on this team: ${a[1].toLowerCase()}.` },
];

const BRIEFS = {
  interview: {
    title: 'System design with Priya Raman',
    sub: 'Larkspur Robotics · Onsite · Tue Nov 3, 10:00–11:00 AM',
    grounded: 'Grounded in: larkspur.example careers and blog pages, 1 earlier Debrief, the Company Brief. Not read (their Terms): glassdoor.com, teamblind.com, leetcode.com, linkedin.com.',
    sections: [
      { key: 'interviewer', name: 'Interviewer', items: ['Priya Raman, Staff Engineer (from the “with” field). <span class="chip chip-warn">unverified</span>'] },
      { key: 'questions', name: 'Likely questions', items: ['Design a service that ingests telemetry from a robot fleet.', 'Edge vs. cloud processing trade-offs.'], src: 'Phase Kind checklist; common robotics prompts' },
      { key: 'stories', name: 'Stories to tell', items: ['<b>Migrating the dispatch queue</b>, tailored to “Ship safely”.', '<b>Untangling on-call alerts</b>, tailored to “Own the outcome”.'] },
      { key: 'debriefs', name: 'From earlier Debriefs', items: ['Recruiter screen (Oct 21): the recruiter stressed “reliability over speed”.'] },
    ],
  },
  company: {
    title: 'Larkspur Robotics',
    sub: 'Company Brief · Senior Backend Engineer loop · refreshed Oct 22',
    grounded: 'Grounded in: larkspur.example, two news articles, your notes. Not read (their Terms): glassdoor.com, teamblind.com.',
    sections: [
      { key: 'what', name: 'What they do', items: ['Warehouse-picking robots; about 600 people; Series D (2025).'], src: 'larkspur.example/about' },
      { key: 'values', name: 'Values', items: ['Ship safely · Own the outcome · Be kind and direct.'], src: 'larkspur.example/careers' },
      { key: 'news', name: 'Recent news', items: ['Opened a Denver depot (Sep 2026).'], src: 'two news articles' },
      { key: 'how', name: 'How they interview', items: [] },
    ],
  },
};

// ---------- state ----------
const state = {
  entries: [
    { id: 'e0', brief: 'company', section: 'how', text: 'The take-home was dropped in favor of live coding.', route: 'notes', source: 'Your notes', added: 'Oct 2', age: 'Older than 18 months' },
  ],
  gap: Object.fromEntries(GAPS.map(g => [g.id, { status: 'open', looked: null }])),
};
const ui = {
  variant: 'inline', name: 0, tab: 'interview', toast: '',
  visited: {},            // link id -> true once the Owner opened it
  open: {},               // gap id -> expanded (A)
  route: {},              // gap id -> 'capture' | 'notes' | 'check'
  check: {},              // gap id -> { qi, answers: [] }
  proposal: {},           // gap id -> pending proposal
  notes: {},              // gap id -> { text, age, brief }
  focus: null,            // B: selected gap id
  sess: null,             // C: session state
  justAdded: new Set(),
};
let seq = 1;
const nid = p => p + (seq++);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NAME = () => NAMES[ui.name];
const gapById = id => GAPS.find(g => g.id === id);
const openGaps = () => GAPS.filter(g => state.gap[g.id].status === 'open');
const sectionName = (brief, key) => BRIEFS[brief].sections.find(s => s.key === key).name;

// ---------- shared mechanics ----------
function makeProposal(gap, route, text, age, source) {
  return { gapId: gap.id, brief: gap.brief, section: gap.section, route, text, age, source };
}
function acceptProposal(p) {
  const e = { id: nid('e'), brief: p.brief, section: p.brief === gapById(p.gapId).brief ? p.section : fallbackSection(p.brief, p.gapId), text: p.text, route: p.route, source: p.source, added: TODAY, age: p.age };
  state.entries.push(e);
  ui.justAdded.add(e.id);
  state.gap[p.gapId].status = 'closed';
  delete ui.proposal[p.gapId]; delete ui.route[p.gapId]; delete ui.check[p.gapId]; delete ui.notes[p.gapId];
  return e;
}
function fallbackSection(brief, gapId) {

// ---------- C: session ----------
function sessInit() {
  ui.sess = { phase: 'reading', order: openGaps().map(g => g.id), gi: 0, qi: 0, answers: [], log: [], queue: [], skipped: [], mode: 'chips' };
}
function sessGap() { const s = ui.sess; return gapById(s.order[s.gi]); }
function sessStartGap() {
  const s = ui.sess;
  while (sessGap() && s.queue.some(p => p.gapId === sessGap().id)) {
    s.log.push({ who: 'sys', text: `Skipping “${sessGap().title}”: your captured page covers it` });
    s.gi++;
  }
  const g = sessGap();
  if (!g) { s.phase = 'review'; s.log.push({ who: 'sys', text: 'All gaps covered. Review what goes into the briefs.' }); return; }
  s.qi = 0; s.answers = [];
  const opened = g.links.filter(l => ui.visited[l.id]).map(l => l.host);
  s.log.push({ who: 'sys', text: `Gap ${s.gi + 1} of ${s.order.length} · ${g.title}` });
  s.log.push({ who: 'claude', text: opened.length ? `You opened ${[...new Set(opened)].join(' and ')}. ${g.qs[0].q}` : `You haven’t opened a link for this one; answer from memory or skip it. ${g.qs[0].q}` });
}
function sessAnswer(val) {
  const s = ui.sess, g = sessGap();
  s.log.push({ who: 'owner', text: val });
  s.answers.push(val);
  s.qi++;
  if (s.qi < g.qs.length) { s.log.push({ who: 'claude', text: g.qs[s.qi].q }); return; }
  const ageQ = g.qs.findIndex(q => q.age);
  const p = makeProposal(g, 'check', g.draft(s.answers), ageQ >= 0 ? s.answers[ageQ] : 'Not sure', checkSource(g));
  s.queue.push(p);
  s.log.push({ who: 'claude', text: `Got it. I’ll propose adding to the ${BRIEF_NAME[g.brief]}: “${p.text}”` });
  s.gi++; sessStartGap();
}
function sessNotes(text) {
  const s = ui.sess, g = sessGap();
  s.log.push({ who: 'owner', text: '📝 ' + text });
  s.queue.push(makeProposal(g, 'notes', text, 'Not sure', 'Your notes'));
  s.log.push({ who: 'claude', text: `Thanks, your notes go in as written. You can set how old the info is in the review.` });
  s.gi++; s.mode = 'chips'; sessStartGap();
}
function sessSkip() {
  const s = ui.sess, g = sessGap();
  s.log.push({ who: 'owner', text: 'Nothing found' });
  state.gap[g.id].looked = TODAY;
  s.skipped.push(g.id);
  s.log.push({ who: 'claude', text: 'Okay. I’ll keep this gap open and note that you looked today.' });
  s.gi++; sessStartGap();
}
function variantSession() {
  if (!ui.sess) sessInit();
  const s = ui.sess;
  const pills = `<div class="pills">${s.order.map((id, i) => {
    const g = gapById(id);
    const cls = s.skipped.includes(id) ? 'is-skip' : (s.queue.some(p => p.gapId === id) || state.gap[id].status === 'closed') ? 'is-done' : (s.phase === 'chat' && i === s.gi) ? 'is-cur' : '';
    return `<span class="pill ${cls}">${esc(g.title)}</span>`;
  }).join('')}</div>`;
  let body;
  if (s.phase === 'reading') {
    body = `<div class="card"><h2>${s.order.length} things are missing before Tue Nov 3</h2>
      <p class="muted">Read these in your own browser (about 20 minutes), then come back for a ${esc(NAME())}: short questions about what you read, one gap at a time. Company pages can be captured now instead.</p>
      ${s.order.map(id => { const g = gapById(id); return `<div class="stack"><div class="gap-title"><span class="chip ${g.brief === 'company' ? 'chip-acc' : 'chip-gap'}">${BRIEF_NAME[g.brief]}</span>${esc(g.title)}</div>${linksHtml(g)}</div>`; }).join('')}
      <div class="row"><button class="btn btn-primary" data-action="sess-start">Start ${esc(NAME())}</button><span class="muted small">${s.queue.length ? s.queue.length + ' captured page' + (s.queue.length > 1 ? 's' : '') + ' already queued for review' : ''}</span></div></div>`;
  } else if (s.phase === 'chat') {
    const g = sessGap(), q = g.qs[s.qi];
    const blind = g.links.some(l => l.blind);
    body = `<div class="chat">${s.log.map(m => `<div class="msg ${m.who}">${esc(m.text)}</div>`).join('')}</div>
      <div class="composer">${s.mode === 'notes' ? `<form class="stack sess-notes"><textarea name="text" placeholder="Write what you learned about “${esc(g.title)}”"></textarea>${blind ? '<div class="hint">Blind bars copying posts: your own words only.</div>' : ''}<div class="row"><button class="btn btn-primary">Add notes</button><button type="button" class="btn" data-action="sess-mode" data-mode="chips">Back to questions</button></div></form>` :
      `<div class="opts">${q.opts.map((o, i) => `<button class="opt ${i === q.suggested ? 'is-suggested' : ''}" data-action="sess-answer" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <form class="row sess-free"><input type="text" name="v" placeholder="Or answer in your own words…" style="flex:1;min-width:160px"><button class="btn">Send</button></form>
      <div class="row"><button class="btn-link" data-action="sess-mode" data-mode="notes">Write notes instead</button><button class="btn-link" data-action="sess-skip">Nothing found</button></div>`}</div>`;
  } else {
    const col = b => {
      const ps = s.queue.filter(p => p.brief === b);
      return `<div class="card"><h3>${BRIEF_NAME[b]}</h3><p class="muted small">${b === 'company' ? 'Shared by every Interview in this loop.' : 'This Interview only.'}</p>
        ${ps.length ? ps.map(p => {
          const i = s.queue.indexOf(p);
          return `<div class="proposal"><div class="eyebrow">${esc(sectionName(p.brief, p.brief === gapById(p.gapId).brief ? p.section : fallbackSection(p.brief, p.gapId)))}</div>
          <textarea data-action="sess-edit" data-i="${i}">${esc(p.text)}</textarea>
          <div class="row small"><span class="muted">${esc(p.source)} · added ${TODAY} ·</span>${p.route === 'capture' ? `<span>${esc(p.age)}</span>` : `<select data-action="sess-age" data-i="${i}">${AGES.map(a => `<option ${a === p.age ? 'selected' : ''}>${a}</option>`).join('')}</select>`}</div>
          <div class="row"><button class="btn btn-primary" data-action="sess-accept" data-i="${i}">Accept</button><button class="btn" data-action="sess-move" data-i="${i}">Move to ${BRIEF_NAME[b === 'company' ? 'interview' : 'company']}</button><button class="btn" data-action="sess-reject" data-i="${i}">Reject</button></div></div>`;
        }).join('') : '<p class="muted small">Nothing to add here.</p>'}</div>`;
    };
    const applied = state.entries.filter(e => ui.justAdded.has(e.id));
    body = `<div class="card"><h2>Review: ${s.queue.length} proposed addition${s.queue.length === 1 ? '' : 's'}</h2>
      <p class="muted small">Nothing changes in a brief until you accept it. ${s.skipped.length ? `${s.skipped.length} gap${s.skipped.length > 1 ? 's' : ''} stay open, marked “looked ${TODAY}”.` : ''}</p></div>
      <div class="review">${col('interview')}${col('company')}</div>
      ${applied.length ? `<div class="card"><h3>Added this session</h3>${applied.map(entryHtml).join('')}</div>` : ''}
      <div class="row"><button class="btn" data-action="sess-reset">Start a new ${esc(NAME())}</button></div>`;
  }
  return `${header()}<main class="shell">${crumb()}<div class="sess">${pills}${body}</div></main>`;
}

// ---------- render + switcher ----------
function switcher() {
  const v = VARIANTS.find(x => x.key === ui.variant);
  return `<div class="switcher" role="toolbar" aria-label="Prototype controls">
    <button data-action="variant" data-step="-1" aria-label="Previous variant">←</button><span class="sw-label">${v.label}</span><button data-action="variant" data-step="1" aria-label="Next variant">→</button>
    <span class="sw-name"><button data-action="name" title="Cycle candidate names">Name: ${esc(NAME())} ↻</button></span></div>`;
}
function render() {
  const y = window.scrollY;
  const view = { inline: variantInline, panel: variantPanel, session: variantSession }[ui.variant];
  document.getElementById('app').innerHTML = view() + switcher() + (ui.toast ? `<div class="toast" role="status">${esc(ui.toast)}</div>` : '');
  window.scrollTo(0, y);
}
function toast(msg) { ui.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { ui.toast = ''; render(); }, 2400); }
function setVariant(key) { ui.variant = key; try { location.hash = key; } catch (e) {} render(); }
function readHash() { const h = (location.hash || '').slice(1); return VARIANTS.some(v => v.key === h) ? h : 'inline'; }
function closedToast(e) { toast(`Added to the ${BRIEF_NAME[e.brief]} · ${sectionName(e.brief, e.section)}`); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.matches('select, input, textarea')) return;
  const a = el.dataset.action, gap = el.dataset.gap && gapById(el.dataset.gap);
  if (a === 'visit') { e.preventDefault(); ui.visited[el.dataset.link] = true; toast(`Opens ${L[el.dataset.link].host} in your own browser (prototype: not really)`); }
  else if (a === 'variant') { const i = VARIANTS.findIndex(v => v.key === ui.variant); setVariant(VARIANTS[(i + Number(el.dataset.step) + VARIANTS.length) % VARIANTS.length].key); }
  else if (a === 'name') { ui.name = (ui.name + 1) % NAMES.length; render(); }
  else if (a === 'tab') { ui.tab = el.dataset.tab; render(); }
  else if (a === 'expand') { ui.open[gap.id] = true; render(); }
  else if (a === 'focus') { ui.focus = gap.id; window.scrollTo(0, 0); render(); }
  else if (a === 'unfocus') { ui.focus = null; render(); }
  else if (a === 'route') { ui.route[gap.id] = el.dataset.route; delete ui.proposal[gap.id]; if (el.dataset.route === 'check') ui.check[gap.id] = { qi: 0, answers: [] }; render(); }
  else if (a === 'nothing') { state.gap[gap.id].looked = TODAY; delete ui.route[gap.id]; ui.open[gap.id] = false; toast('Gap stays open, marked “looked today, nothing found”'); }
  else if (a === 'capture') {
    const link = L[el.dataset.link];
    ui.visited[link.id] = true;
    if (ui.variant === 'session' && ui.sess && ui.sess.phase === 'reading') { ui.sess.queue.push(captureProposal(gap, link)); toast(`Captured ${link.host}; queued for review`); return; }
    ui.proposal[gap.id] = captureProposal(gap, link); ui.route[gap.id] = 'capture'; ui.open[gap.id] = true; if (ui.variant === 'panel') ui.focus = gap.id; render();
  }
  else if (a === 'answer') { answer(gap, el.dataset.val); }
  else if (a === 'accept') { const ent = acceptProposal(ui.proposal[gap.id]); closedToast(ent); }
  else if (a === 'reject') { delete ui.proposal[gap.id]; delete ui.route[gap.id]; toast('Rejected; the gap stays open'); }
  else if (a === 'sess-start') { ui.sess.phase = 'chat'; sessStartGap(); render(); }
  else if (a === 'sess-answer') { sessAnswer(el.dataset.val); render(); }
  else if (a === 'sess-mode') { ui.sess.mode = el.dataset.mode; render(); }
  else if (a === 'sess-skip') { sessSkip(); render(); }
  else if (a === 'sess-accept') { const p = ui.sess.queue.splice(Number(el.dataset.i), 1)[0]; const ent = acceptProposal(p); closedToast(ent); }
  else if (a === 'sess-reject') { ui.sess.queue.splice(Number(el.dataset.i), 1); toast('Rejected; the gap stays open'); }
  else if (a === 'sess-move') { const p = ui.sess.queue[Number(el.dataset.i)]; p.brief = p.brief === 'company' ? 'interview' : 'company'; render(); }
  else if (a === 'sess-reset') { sessInit(); render(); }
});
function answer(gap, val) {
  const c = ui.check[gap.id];
  c.answers.push(val); c.qi++;
  if (c.qi >= gap.qs.length) {
    const ageQ = gap.qs.findIndex(q => q.age);
    ui.proposal[gap.id] = makeProposal(gap, 'check', gap.draft(c.answers), ageQ >= 0 ? c.answers[ageQ] : 'Not sure', checkSource(gap));
  }
  render();
}
document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.action, id = el.dataset.gap;
  if (a === 'proposal-dest') { ui.proposal[id].brief = el.value; render(); }
  if (a === 'note-dest') { ui.notes[id].brief = el.value; render(); }
  if (a === 'note-age') { ui.notes[id].age = el.value; }
  if (a === 'sess-age') { ui.sess.queue[Number(el.dataset.i)].age = el.value; }
});
document.addEventListener('input', e => {
  const el = e.target, a = el.dataset.action, id = el.dataset.gap;
  if (a === 'edit-proposal') ui.proposal[id].text = el.value;
  if (a === 'note-text') ui.notes[id].text = el.value;
  if (a === 'sess-edit') ui.sess.queue[Number(el.dataset.i)].text = el.value;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, gap = f.dataset.gap && gapById(f.dataset.gap);
  if (f.classList.contains('answer-form')) { const v = f.v.value.trim(); if (v) answer(gap, v); }
  else if (f.classList.contains('notes-form')) {
    const n = ui.notes[gap.id]; if (!n.text.trim()) return;
    const p = makeProposal(gap, 'notes', n.text.trim(), n.age, 'Your notes'); p.brief = n.brief;
    closedToast(acceptProposal(p));
  }
  else if (f.classList.contains('sess-free')) { const v = f.v.value.trim(); if (v) { sessAnswer(v); render(); } }
  else if (f.classList.contains('sess-notes')) { const v = f.text.value.trim(); if (v) { sessNotes(v); render(); } }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const i = VARIANTS.findIndex(v => v.key === ui.variant);
    setVariant(VARIANTS[(i + (e.key === 'ArrowRight' ? 1 : -1) + VARIANTS.length) % VARIANTS.length].key);
  }
});
window.addEventListener('hashchange', () => { const k = readHash(); if (k !== ui.variant) { ui.variant = k; render(); } });

ui.variant = readHash();
render();
</script>
